<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CozyXtreme</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --accent: #088178;
      --border: #e4e0d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --card: #1e1e1e;
        --text: #f1f1f1;
        --muted: #a0a0a0;
        --accent: #3cc1b5;
        --border: #2e2e2e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 16px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 2.2rem; letter-spacing: -0.02em; }
    header p { color: var(--muted); margin-top: 8px; }
    .list { width: 100%; max-width: 520px; display: grid; gap: 12px; }
    a.site {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text);
      transition: border-color .15s, transform .15s;
    }
    a.site:hover { border-color: var(--accent); transform: translateY(-2px); }
    .site strong { display: block; font-size: 1.05rem; }
    .site span { color: var(--muted); font-size: .9rem; }
    .arrow { color: var(--accent); font-size: 1.3rem; }
    footer { margin-top: auto; padding-top: 48px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>CozyXtreme</h1>
    <p>Kumpulan website</p>
  </header>

  <main class="list">
    <a class="site" href="cozystore/">
      <div>
        <strong>Cozy Store</strong>
        <span>Toko online</span>
      </div>
      <div class="arrow">&rarr;</div>
    </a>
    <!-- Tambahkan website baru di sini, contoh:
    <a class="site" href="ultah/">
      <div>
        <strong>Ucapan Ulang Tahun</strong>
        <span>Untuk teman spesial</span>
      </div>
      <div class="arrow">&rarr;</div>
    </a>
    -->
  </main>

  <footer>&copy; CozyXtreme</footer>
</body>
</html>
